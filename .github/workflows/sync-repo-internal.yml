name: Internal synchronize from public repository

on:
  workflow_dispatch:

  # Run on a daily basis
  schedule:
    - cron: '4 21 * * *'

jobs:
  build-run:
    name: Synchronize from public repository
    uses: cFS/workflows/.github/workflows/sync-repo-internal.yml@dev
    with:
      upstream-repo: https://github.com/nasa/cs.git
      local-branch-prefix: ''
