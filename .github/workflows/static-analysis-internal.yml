name: Internal Static Analysis

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

jobs:
  static-analysis:
    name: Static Analysis
    uses: cFS/workflows/.github/workflows/static-analysis-reusable-internal.yml@dev
    with:
      source-dir: 'source/fsw'
