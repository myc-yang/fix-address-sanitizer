name: Internal MCDC Analysis

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

jobs:
  mcdc:
    name: Run MCDC Analysis
    uses: cFS/workflows/.github/workflows/mcdc-reusable-internal.yml@dev
    with:
      app-name: 'cs'
