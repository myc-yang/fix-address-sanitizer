name: Internal CodeSonar

on:
  schedule:
    - cron: "0 0 * * 1"  # Runs every Monday at 12:00 AM UTC
  workflow_dispatch:

jobs:
  codesonar:
    name: Run CodeSonar
    uses: cFS/workflows/.github/workflows/codesonar-reusable-internal.yml@dev
    with:
      component-path: apps/cs
      setup: |
        cp ./cfe/cmake/Makefile.sample Makefile && cp -r ./cfe/cmake/sample_defs sample_defs
        sed -i "/list(APPEND MISSION_GLOBAL_APPLIST/a list(APPEND MISSION_GLOBAL_APPLIST cs)" sample_defs/targets.cmake
      prep: |
        make prep
        make -C build/tools/elf2cfetbl
      make: make -C build/native/default_cpu1/apps/cs
    secrets: inherit