name: Internal CodeSonar

on:
  schedule:
    - cron: "0 0 * * 1"  # Runs every Monday at 12:00 AM UTC
  workflow_dispatch:

jobs:
  codesonar:
    name: Run CodeSonar
    uses: cFS/workflows/.github/workflows/codesonar-reusable-internal.yml@dev
    with:
      component-path: apps/cs
      make: make -C build/native/default_cpu1/apps/cs
    secrets: inherit